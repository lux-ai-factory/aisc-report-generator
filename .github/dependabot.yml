# Version updates for this repository's locks and its workflow actions. Security alerts come
# regardless of this file.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/plugins/langbite"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/plugins/mlareject"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/plugins/promptfoo"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/plugins/strongreject"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
