[project]
name = "aisc-report"
version = "0.1.0"
description = "The report microservice: draws the assessment report (HTML/PDF) from the backend's JSON snapshot, reading no database."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "jinja2>=3.1.6",
    "weasyprint>=70.0",
    # weasyprint's image decoding and SVG (12.3 fixes the 2026 CVEs)
    "pillow>=12.3.0",
    "cairosvg>=2.7",
    "defusedxml>=0.7",
    "lxml>=5",
]

# A service repository, not a library: the packages run in place from src/, like apps/qualification.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.17.5",
    "ty>=0.0.105",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
